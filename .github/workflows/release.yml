name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release & Debug APKs
        run: ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Prepare APK Artifacts
        run: |
          cp app/build/outputs/apk/release/app-release.apk FlacPlayer-${{ github.ref_name }}-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk FlacPlayer-${{ github.ref_name }}-debug.apk

      - name: Create Release and Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FlacPlayer-${{ github.ref_name }}-release.apk
            FlacPlayer-${{ github.ref_name }}-debug.apk
          tag_name: ${{ github.ref_name }}
          name: FlacPlayer ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
