name: Build and Release All Platforms

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Preinstalled Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release & Debug APKs
        run: ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Prepare APK Artifacts
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/FlacPlayer-${{ github.ref_name }}-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/FlacPlayer-${{ github.ref_name }}-debug.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: artifacts/*.apk

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install Desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Linux Packages (.deb, AppImage, tar.gz)
        working-directory: desktop
        run: ./node_modules/.bin/electron-builder --linux AppImage deb tar.gz

      - name: Collect Linux Artifacts
        run: |
          mkdir -p linux-artifacts
          cp desktop/dist/*.deb linux-artifacts/
          cp desktop/dist/*.AppImage linux-artifacts/
          cp desktop/dist/*.tar.gz linux-artifacts/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: linux-artifacts/*

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install Desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Windows Portable & Setup Installer (.exe)
        working-directory: desktop
        run: npx electron-builder --win portable nsis

      - name: Collect Windows Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path windows-artifacts | Out-Null
          Copy-Item desktop/dist/*.exe windows-artifacts/

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: windows-artifacts/*

  publish-release:
    needs: [build-android, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APKs
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: release-files

      - name: Download Linux Builds
        uses: actions/download-artifact@v4
        with:
          name: linux-builds
          path: release-files

      - name: Download Windows Builds
        uses: actions/download-artifact@v4
        with:
          name: windows-builds
          path: release-files

      - name: Create GitHub Release and Upload All Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-files/*
          tag_name: ${{ github.ref_name }}
          name: FlacPlayer ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
